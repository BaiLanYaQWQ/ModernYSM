name: Build

# 本仓库只保留 fabric + neoforge 两个加载器（forge 模块已移除）。
# 三个向下移植分支共用一个流程：当前分支的 gradle.properties 决定 Minecraft 版本，
# wrapper 决定 Gradle 版本（26.x 系列为 9.7.1），JDK 统一 25。
#
# 触发方式：
#   - push / PR 到三个 port 分支  → 只构建并上传 Artifacts
#   - push 形如 v* 的 tag         → 构建 + 发 GitHub Release（附带两个 jar）
#   - 手动 workflow_dispatch     → 只构建并上传 Artifacts
on:
  push:
    branches: ['port/26.3', 'port/26.2', 'port/26.1.2']
    tags: ['v*']
    paths-ignore: &meta-only
      - '**.md'
      - 'LICENSE'
      - '.gitignore'
      - '.gitattributes'
  pull_request:
    branches: ['port/26.3', 'port/26.2', 'port/26.1.2']
    paths-ignore: *meta-only
  workflow_dispatch:

permissions:
  # 发 Release 需要写权限；Artifacts 上传不需要
  contents: write

# 同一分支/PR 的旧运行会被新推送取消，避免堆积
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    # 冷缓存要下 Minecraft / loom / NeoForge 全套依赖，20 分钟偏紧
    timeout-minutes: 40
    env:
      # 资源目录里有中文文件名的 avif，非 UTF-8 locale 会让 processResources 报
      # "Failed to create MD5 hash ... No such file or directory"
      LANG: C.UTF-8
      LC_ALL: C.UTF-8
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - uses: gradle/actions/setup-gradle@v4

      # artifact 名不允许 '/'，而分支名是 port/26.x —— 先把斜杠换成 '-'。
      - name: Resolve artifact suffix
        id: meta
        run: echo "suffix=${GITHUB_REF_NAME//\//-}" >> "$GITHUB_OUTPUT"

      # 根工程没有编译任务；这里显式驱动两个加载器子工程。
      - name: Compile and package (fabric + neoforge)
        run: bash ./gradlew :fabric:build :neoforge:build --no-daemon --console=plain --stacktrace

      # 两个加载器的产物同名（openysm-<版本>.jar），分目录上传避免冲突。
      - name: Upload fabric jar
        uses: actions/upload-artifact@v4
        with:
          name: openysm-fabric-${{ steps.meta.outputs.suffix }}
          path: |
            fabric/build/libs/openysm-*.jar
            !**/*-sources.jar
          if-no-files-found: error

      - name: Upload neoforge jar
        uses: actions/upload-artifact@v4
        with:
          name: openysm-neoforge-${{ steps.meta.outputs.suffix }}
          path: |
            neoforge/build/libs/openysm-*.jar
            !**/*-sources.jar
          if-no-files-found: error

      # 只有 tag 推送才发 Release。两个加载器的 jar 同名，先各复制成
      # openysm-<版本>-fabric.jar / -neoforge.jar 再上传。
      - name: Stage release jars
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          MC=$(grep '^minecraft_version=' gradle.properties | cut -d= -f2)
          mkdir -p release
          for loader in fabric neoforge; do
            jar=$(ls $loader/build/libs/openysm-*.jar | grep -v -- '-sources' | head -1)
            cp "$jar" "release/$(basename "$jar" .jar)-$loader-$MC.jar"
          done
          ls -l release

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: release/*.jar
          name: ${{ github.ref_name }}
          generate_release_notes: true
          body: |
            自动构建产物（${{ github.ref_name }}）。

            - `openysm-<mod版本>-fabric-<MC版本>.jar` — Fabric 版
            - `openysm-<mod版本>-neoforge-<MC版本>.jar` — NeoForge 版

            需要 JDK 25 运行环境（Minecraft 26.x 系列）。
