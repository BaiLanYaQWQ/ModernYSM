name: Build

# 本仓库只保留 fabric + neoforge 两个加载器（forge 模块已移除）。
# 三个向下移植分支共用一个流程：当前分支的 gradle.properties 决定 Minecraft 版本，
# wrapper 决定 Gradle 版本（26.x 系列为 9.7.1），JDK 统一 25。
on:
  push:
    branches: ['port/26.3', 'port/26.2', 'port/26.1.2']
    paths-ignore: &meta-only
      - '**.md'
      - 'LICENSE'
      - '.gitignore'
      - '.gitattributes'
  pull_request:
    branches: ['port/26.3', 'port/26.2', 'port/26.1.2']
    paths-ignore: *meta-only
  workflow_dispatch:

permissions:
  contents: read

# 同一分支/PR 的旧运行会被新推送取消，避免堆积
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    # 冷缓存要下 Minecraft / loom / NeoForge 全套依赖，20 分钟偏紧
    timeout-minutes: 40
    env:
      # 资源目录里有中文文件名的 avif，非 UTF-8 locale 会让 processResources 报
      # "Failed to create MD5 hash ... No such file or directory"
      LANG: C.UTF-8
      LC_ALL: C.UTF-8
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - uses: gradle/actions/setup-gradle@v4

      # artifact 名不允许 '/'，而分支名是 port/26.x —— 先把斜杠换成 '-'。
      - name: Resolve artifact suffix
        id: meta
        run: echo "suffix=${GITHUB_REF_NAME//\//-}" >> "$GITHUB_OUTPUT"

      # 根工程没有编译任务；这里显式驱动两个加载器子工程。
      - name: Compile and package (fabric + neoforge)
        run: bash ./gradlew :fabric:build :neoforge:build --no-daemon --console=plain --stacktrace

      # 两个加载器的产物同名（openysm-<版本>.jar），分目录上传避免冲突。
      - name: Upload fabric jar
        uses: actions/upload-artifact@v4
        with:
          name: openysm-fabric-${{ steps.meta.outputs.suffix }}
          path: |
            fabric/build/libs/openysm-*.jar
            !**/*-sources.jar
          if-no-files-found: error

      - name: Upload neoforge jar
        uses: actions/upload-artifact@v4
        with:
          name: openysm-neoforge-${{ steps.meta.outputs.suffix }}
          path: |
            neoforge/build/libs/openysm-*.jar
            !**/*-sources.jar
          if-no-files-found: error
